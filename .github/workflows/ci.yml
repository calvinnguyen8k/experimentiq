name: Verify ExperimentIQ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check source for secret patterns
        run: python scripts/check_secrets.py
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - name: Backend lint and tests
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, types, and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests with mocked OpenAI
        working-directory: frontend
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
